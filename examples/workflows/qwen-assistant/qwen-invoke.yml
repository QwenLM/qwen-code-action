name: '▶️ Qwen Code Invoke'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false
    secrets:
      QWEN_API_KEY:
        description: 'The API key for the Qwen Code API.'
        required: false
      APP_PRIVATE_KEY:
        description: 'The private key of the GitHub App used for identity.'
        required: false

concurrency:
  group: '${{ github.workflow }}-invoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Run Qwen Code'
        id: 'run_qwen'
        uses: 'QwenLM/qwen-code-action@v1' # ratchet:exclude
        env:
          GITHUB_TOKEN: ''
          TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          DESCRIPTION: '${{ github.event.pull_request.body || github.event.issue.body }}'
          EVENT_NAME: '${{ github.event_name }}'
          IS_PULL_REQUEST: '${{ !!github.event.pull_request }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
        with:
          openai_api_key: '${{ secrets.QWEN_API_KEY }}'
          openai_base_url: '${{ vars.QWEN_BASE_URL }}'
          openai_model: '${{ vars.QWEN_MODEL }}'
          qwen_cli_version: '${{ vars.QWEN_CLI_VERSION }}'
          qwen_debug: '${{ fromJSON(vars.DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'qwen-invoke'
          approval_mode: 'default'
          untrusted_input: 'true'
          github_token: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".qwen/telemetry.log"
              },
              "disableAllHooks": true,
              "permissions": {
                "allow": [
                  "mcp__github__add_issue_comment",
                  "mcp__github__get_issue",
                  "mcp__github__get_issue_comments",
                  "mcp__github__list_issues",
                  "mcp__github__search_issues",
                  "mcp__github__pull_request_read",
                  "mcp__github__list_pull_requests",
                  "mcp__github__search_pull_requests",
                  "mcp__github__get_commit",
                  "mcp__github__get_file_contents",
                  "mcp__github__list_commits",
                  "mcp__github__search_code"
                ]
              },
              "tools": {
                "disabled": [
                  "run_shell_command",
                  "monitor"
                ],
                "visible": [
                  "mcp__github__add_issue_comment",
                  "mcp__github__get_issue",
                  "mcp__github__get_issue_comments",
                  "mcp__github__list_issues",
                  "mcp__github__search_issues",
                  "mcp__github__pull_request_read",
                  "mcp__github__list_pull_requests",
                  "mcp__github__search_pull_requests",
                  "mcp__github__get_commit",
                  "mcp__github__get_file_contents",
                  "mcp__github__list_commits",
                  "mcp__github__search_code"
                ],
                "core": [
                  "read_file",
                  "glob",
                  "grep_search",
                  "mcp__github__add_issue_comment",
                  "mcp__github__get_issue",
                  "mcp__github__get_issue_comments",
                  "mcp__github__list_issues",
                  "mcp__github__search_issues",
                  "mcp__github__pull_request_read",
                  "mcp__github__list_pull_requests",
                  "mcp__github__search_pull_requests",
                  "mcp__github__get_commit",
                  "mcp__github__get_file_contents",
                  "mcp__github__list_commits",
                  "mcp__github__search_code"
                ]
              }
            }
          prompt: '/qwen-invoke'
