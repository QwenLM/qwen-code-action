name: '🔎 Qwen Code Review'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false
    secrets:
      QWEN_API_KEY:
        description: 'The API key for the Qwen Code API.'
        required: false
      APP_PRIVATE_KEY:
        description: 'The private key of the GitHub App used for identity.'
        required: false

concurrency:
  group: '${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 7
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Checkout repository'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          # Check out the trusted base, never the PR merge ref: the diff is
          # fetched through the GitHub API instead, so PR-controlled files
          # (QWEN.md, .qwen/) never land in the agent's workspace.
          ref: '${{ github.event.pull_request.base.sha || github.sha }}'
          persist-credentials: false

      - name: 'Prepare GitHub MCP config'
        shell: 'bash'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
        run: |-
          set -euo pipefail
          # Workspace settings MCP servers are approval-gated in non-YOLO
          # modes; --mcp-config servers are caller-supplied and never gated.
          # Write the token-bearing config outside the workspace so the
          # agent's file tools cannot read it.
          MCP_CONFIG_FILE="$(mktemp -p "${RUNNER_TEMP}" qwen-mcp.XXXXXXXXXX.json)"
          chmod 600 "${MCP_CONFIG_FILE}"
          TOKEN="${GITHUB_TOKEN}" python3 - "${MCP_CONFIG_FILE}" <<'PY'
          import json
          import os
          import sys

          config = {
              'mcpServers': {
                  'github': {
                      'command': 'docker',
                      'args': [
                          'run', '-i', '--rm', '-e', 'GITHUB_PERSONAL_ACCESS_TOKEN',
                          'ghcr.io/github/github-mcp-server@sha256:6aa543f565bc98d96106fdd80a0abdc0c7147c8ca7f4663a814ceecef1ccc6d3',
                      ],
                      'includeTools': [
                          'add_comment_to_pending_review',
                          'create_pending_pull_request_review',
                          'pull_request_read',
                          'submit_pending_pull_request_review',
                      ],
                      'env': {'GITHUB_PERSONAL_ACCESS_TOKEN': os.environ['TOKEN']},
                  }
              }
          }
          with open(sys.argv[1], 'w') as out:
              json.dump(config, out)
          PY
          echo "MCP_CONFIG_FILE=${MCP_CONFIG_FILE}" >> "${GITHUB_ENV}"

      - name: 'Run Qwen Code pull request review'
        uses: 'QwenLM/qwen-code-action@v1' # ratchet:exclude
        id: 'qwen_pr_review'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.pull_request.body || github.event.issue.body }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
        with:
          openai_api_key: '${{ secrets.QWEN_API_KEY }}'
          openai_base_url: '${{ vars.QWEN_BASE_URL }}'
          openai_model: '${{ vars.QWEN_MODEL }}'
          qwen_cli_version: '${{ vars.QWEN_CLI_VERSION }}'
          qwen_debug: '${{ fromJSON(vars.DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'qwen-review'
          approval_mode: 'default'
          extra_args: '--mcp-config ${MCP_CONFIG_FILE}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".qwen/telemetry.log"
              },
              "disableAllHooks": true,
              "permissions": {
                "allow": [
                  "mcp__github__add_comment_to_pending_review",
                  "mcp__github__create_pending_pull_request_review",
                  "mcp__github__pull_request_read",
                  "mcp__github__submit_pending_pull_request_review"
                ]
              },
              "tools": {
                "disabled": [
                  "run_shell_command",
                  "monitor"
                ],
                "visible": [
                  "mcp__github__add_comment_to_pending_review",
                  "mcp__github__create_pending_pull_request_review",
                  "mcp__github__submit_pending_pull_request_review",
                  "mcp__github__pull_request_read"
                ],
                "core": [
                  "read_file",
                  "glob",
                  "grep_search",
                  "mcp__github__add_comment_to_pending_review",
                  "mcp__github__create_pending_pull_request_review",
                  "mcp__github__submit_pending_pull_request_review",
                  "mcp__github__pull_request_read"
                ]
              }
            }
          prompt: '/qwen-review'

      - name: 'Enforce COMMENT-only reviews'
        if: |-
          ${{ always() && steps.qwen_pr_review.outcome != 'skipped' }}
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7
        env:
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
        with:
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          script: |-
            // The prompt tells the agent to submit COMMENT reviews only; this
            // is the code-level gate. Any APPROVE / REQUEST_CHANGES review the
            // bot submitted is dismissed, so an injected agent cannot approve
            // a PR or block it with requested changes.
            const issueNumber = Number(process.env.PULL_REQUEST_NUMBER);
            if (!issueNumber) {
              core.info('No pull request number in context; nothing to enforce.');
              return;
            }
            let failed = false;
            try {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: issueNumber,
                per_page: 100,
              });
              for (const review of reviews) {
                if (review.state !== 'APPROVED' && review.state !== 'CHANGES_REQUESTED') {
                  continue;
                }
                // Only automated identities (the GitHub App or github-actions)
                // post as Bot users. Bot policy is COMMENT-only on every run,
                // so stale bot approvals are dismissed too; human reviews are
                // never touched.
                if (review.user?.type !== 'Bot') {
                  continue;
                }
                try {
                  await github.rest.pulls.dismissReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: issueNumber,
                    review_id: review.id,
                    message: 'Automated reviews may only comment. This review was dismissed because the agent used a non-COMMENT review event.',
                  });
                  core.warning(`Dismissed ${review.state} review ${review.id} submitted by ${review.user?.login}.`);
                } catch (error) {
                  failed = true;
                  core.error(`Could not dismiss review ${review.id}: ${error.message}`);
                }
              }
            } catch (error) {
              core.setFailed(`COMMENT-only review enforcement could not list reviews: ${error.message}`);
              return;
            }
            if (failed) {
              core.setFailed('COMMENT-only review enforcement could not dismiss every non-COMMENT bot review.');
            }
